[package]
name = "jucode-cli"
version.workspace = true
edition = "2021"

[[bin]]
name = "jucode"
path = "src/main.rs"

[workspace]
members = [".", "crates/agent-core", "crates/tui", "crates/vendor"]
resolver = "2"

[workspace.package]
version = "0.2.0"

[dependencies]
jucode-agent-core = { path = "crates/agent-core" }
jucode-tui = { path = "crates/tui" }
serde_json = "1"
