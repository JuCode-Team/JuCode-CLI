[package]
name = "jucode-cli"
version.workspace = true
license.workspace = true
authors.workspace = true
edition = "2021"

[[bin]]
name = "jucode"
path = "src/main.rs"

[workspace]
members = [".", "crates/agent-core", "crates/daemon", "crates/llm-provider-kit", "crates/tui"]
resolver = "2"

[workspace.package]
version = "0.4.3"
license = "Apache-2.0"
authors = ["Jucode Innovations INC."]

[dependencies]
jucode-agent-core = { path = "crates/agent-core" }
jucode-daemon = { path = "crates/daemon" }
jucode-tui = { path = "crates/tui" }
serde_json = "1"
tungstenite = "0.30"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
