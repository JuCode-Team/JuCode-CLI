[package]
name = "jucode-daemon"
version.workspace = true
license.workspace = true
authors.workspace = true
edition = "2021"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
getrandom = "0.2"
jucode-agent-core = { path = "../agent-core" }
# Pins rustls's crypto provider to ring (already used by ureq) so `wss://`
# relay connections never need aws-lc.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1"
sha2 = "0.10"
snow = { version = "0.10", default-features = false, features = ["std", "use-chacha20poly1305", "use-curve25519", "use-getrandom", "use-sha2"] }
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
ureq = "2"
